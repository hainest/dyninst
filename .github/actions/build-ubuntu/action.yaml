name: Build Ubuntu

inputs:
  extra-cmake-flags:
    required: false
  compiler:
    required: true
  compiler-version:
    required: false
  build-type:
    required: false
    default: "RELWITHDEBINFO"
  install-dir:
    required: false
    default: ""
  build-dir:
    required: true
  src-dir:
    required: false
    default: "/dyninst/src"
  num-jobs:
    required: false
    default: 4
  extra-libs:
    required: false
  tests:
    default: ""
    required: false

runs:
  using: "composite"

  steps:
    - name: Update
      shell: bash
      run: |
        set -ex
        apt update -qq

    - name: Compiler names
      id: compiler-name
      uses: $/.github/actions/compiler-translate
      with:
        name: ${{ inputs.compiler }}
        version: ${{ inputs.compiler-version }}

    # Clang requires that only a single libomp be present and it must match
    # the version of clang.
    - name: Clean libomp install
      if: ${{ inputs.compiler == 'clang' && inputs.compiler-version != '' }}
      shell: bash
      run: |
        set -ex
        apt remove --purge -y "libomp*"
        apt install -qq -y libomp-${{ inputs.compiler-version }}-dev

    - name: Install C compiler (${{ inputs.compiler }})
      shell: bash
      run: |
        set -ex
        apt install -qq -y ${{ steps.compiler-name.outputs.cc }}

    # There is no apt package for clang++
    - name: Install C++ compiler
      if: ${{ inputs.compiler != 'clang' }}
      shell: bash
      run: |
        set -ex
        apt install -qq -y ${{ steps.compiler-name.outputs.cxx }}

    - name: Install extra libs
      if: ${{ inputs.extra-libs != '' }}
      shell: bash
      run: |
        set -ex
        apt install -qq -y ${{ inputs.extra-libs }}

    - name: ${{ inputs.compiler }} ${{ inputs.build-type }} ${{ inputs.extra-cmake-flags }}
      shell: bash
      run: |
        set -ex

        cmake_args="-DCMAKE_C_COMPILER=${{ steps.compiler-name.outputs.cc }} "
        cmake_args+="-DCMAKE_CXX_COMPILER=${{ steps.compiler-name.outputs.cxx }} "
        cmake_args+="-DCMAKE_BUILD_TYPE=${{ inputs.build-type }} "
        cmake_args+="${{ inputs.extra-cmake-flags }} "

        opts="--src-dir ${{ inputs.src-dir }} "
        opts+="--build-dir ${{ inputs.build-dir }} "

        if [[ ! -z "${{ inputs.install-dir }}" ]]; then
          opts+="--install-dir ${{ inputs.install-dir }} "
        fi

        if [[ ! -z "${{ inputs.tests }}" ]]; then
          opts+="-t ${{ inputs.tests }} "
        fi

        bash ${{ inputs.src-dir }}/docker/build.sh ${opts} -v -j ${{ inputs.num-jobs }} -c "${cmake_args}"
