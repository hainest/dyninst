# Workflow configuration settings

name: Configurations

outputs:
  num_build_jobs:
    value: ${{ steps.build_jobs.outputs.count }}

  os-latest:
    value: ${{ steps.os-versions.outputs.latest }}

  os-all:
    value: ${{ steps.os-versions.outputs.all }}

  compilers:
    value: ${{ steps.compilers.outputs.value }}

runs:
  using: "composite"

  steps:
    # GitHub currently uses 4 CPUs per job
    # docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
    - id: build_jobs
      shell: bash
      run: |
        echo "count=4" >> $GITHUB_OUTPUT

    - id: os-versions
      uses: $/.github/actions/os-versions

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - id: compilers
      shell: bash
      run: |
        set -ex
        script="./.github/scripts/compiler_configs.py"
        names=$(python3 ${script} --print-names)
        echo "value=${names}" >> $GITHUB_OUTPUT
