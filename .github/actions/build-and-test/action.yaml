name: Build single config

inputs:
  os:
    required: true
  extra-cmake-flags:
    required: false
  compiler:
    required: true
  compiler-version:
    required: false
  build-type:
    required: false
    type: choice
    options: [DEBUG, RELWITHDEBINFO, RELEASE, MINSIZEREL]
    default: "RELWITHDEBINFO"
  install-dir:
    required: false
    default: "/dyninst/install"
  src-dir:
    required: false
    default: "/dyninst/src"
  num-jobs:
    required: false
    default: 2
  extra-libs:
    required: false
  tests:
    default: ""
    required: false

runs:
  using: "composite"
  steps:
    - name: Build
      if: ${{ startsWith(inputs.os, 'fedora') }}
      uses: dyninst/dyninst/.github/actions/build@master
      with:
        extra-cmake-flags: "-DDYNINST_WARNINGS_AS_ERRORS=ON ${{ inputs.extra-cmake-flags }}"
        compiler: ${{ inputs.compiler }}
        compiler-version: ${{ inputs.compiler-version }}
        build-type: ${{ inputs.build-type }}
        install-dir: ${{ inputs.install-dir }}
        src-dir: ${{ inputs.src-dir }}
        num-jobs: ${{ inputs.num-jobs }}
        extra-libs: ${{ inputs.extra-libs }}
        tests: ${{ inputs.tests }}

    strategy:
      fail-fast: false
      matrix:
        install-dir: ["${GITHUB_WORKSPACE}/install", "/usr"]
    permissions:
      packages: read
    container:
      image: ghcr.io/dyninst/amd64/${{ inputs.os }}-base:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    name: Build and Test (${{ inputs.os }}, ${{ inputs.compiler }}, ${{ matrix.install-dir }})
    steps:
      - name: Checkout Dyninst
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: "src"  # relative to ${GITHUB_WORKSPACE}

      - name: Build Dyninst
        uses: ./src/.github/actions/build
        with:
          os: ${{ inputs.os }}
          compiler: ${{ inputs.compiler }}
          src-dir: "${GITHUB_WORKSPACE}/src"
          install-dir: ${{ matrix.install-dir }}
          tests: "REGRESSION"

      - name: Checkout Test Suite
        if: ${{ inputs.compiler != 'clang' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dyninst/testsuite
          path: "testsuite"  # relative to ${GITHUB_WORKSPACE}

      - name: Build testsuite
        if: ${{ inputs.compiler != 'clang' }}
        shell: bash
        run: |
          set -ex
          cd ${GITHUB_WORKSPACE}/testsuite; mkdir build; cd build
          cmake .. -DDyninst_ROOT=${{ matrix.install-dir }}
          cmake --build . --parallel 2

      - name: Checkout Examples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dyninst/examples
          path: "examples"  # relative to ${GITHUB_WORKSPACE}

      - name: Build examples
        shell: bash
        run: |
          set -ex
          cd ${GITHUB_WORKSPACE}/examples; mkdir build; cd build
          cmake .. -DDyninst_ROOT=${{ matrix.install-dir }}
          cmake --build . --parallel 2

      - name: Checkout External Tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dyninst/external-tests
          path: "external-tests"  # relative to ${GITHUB_WORKSPACE}

      - name: Build external tests
        shell: bash
        run: |
          set -ex
          cd ${GITHUB_WORKSPACE}/external-tests; mkdir build; cd build
          cmake .. -DDyninst_ROOT=${{ matrix.install-dir }} -DCMAKE_CXX_STANDARD=17
          cmake --build . --parallel 2

      - name: Run external tests
        if: ${{ inputs.compiler != 'clang' }}  # libdyninstAPI_RT doesn't work correctly with clang
        shell: bash
        run: |
          set -ex
          export LD_LIBRARY_PATH=/usr/lib:$LD_LIBRARY_PATH
          export DYNINSTAPI_RT_LIB=$(find ${{ matrix.install-dir }} -name libdyninstAPI_RT.so)
          cd ${GITHUB_WORKSPACE}/external-tests/build
          ctest --no-tests=error -VV --output-on-failure .
