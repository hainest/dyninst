# Return the list of operating systems and their versions

name: Get OSes

on:
  workflow_call:
    outputs:
      all:
        value: ${{ jobs.get-oses.outputs.all }}
      latest:
        value: ${{ jobs.get-oses.outputs.latest }}

permissions: {}

jobs:

  get-oses:
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.all.outputs.all }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: all
        uses: ./.github/actions/os-versions
