#    with:
#      tests: "ALL"
#      os-type: "latest"
#    permissions:
#      packages: read

  codegen-cross-build:
    needs: full-builds
    strategry:
      matrix:
        arch: [i386, x86_64, aarch64, ppc64le, amdgpu_gfx908]
    name: Codegen build (${{ matrix.arch }})
    uses: $/.github/workflows/build-and-test.yaml
    with:
      tests: "REGRESSION"
      os-type: "latest"
      extra-cmake-flags: "-DDYNINST_CODEGEN_ARCH=${{ matrix.arch }}"
    permissions:
      packages: read
