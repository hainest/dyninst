# The primary driver for running CI for pull requests

name: CI driver

on:
  workflow_dispatch:

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
       - master

concurrency:
  group: Testing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  labeler:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Apply labels defined in .github/labeler.yml
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13  # v7.0.0

  prechecks:
    needs: labeler
    uses: $/.github/workflows/prechecks.yaml

  docs:
    needs: prechecks
    uses: $/.github/workflows/docs.yaml
    permissions:
      packages: read
