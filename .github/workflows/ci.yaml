# The primary driver for running CI for pull requests

name: CI driver

on:
  workflow_dispatch:

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
       - master

concurrency:
  group: Testing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
