#      packages: read

  full-builds:
#    needs: docs
    uses: $/.github/workflows/build-and-test.yaml
    with:
      tests: "REGRESSION"
      os-type: "all"
    permissions:
      packages: read

#  # When unit tests are enabled, all symbols become visible so ensure
